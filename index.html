<script>
/* Splash (src/components/Splash.tsx): só na primeira visita da sessão. Fica ~2s, depois a cortina sobe.
   Clique ou tecla pulam. Ao começar a subir, dispara "splash:reveal" (as animações da abertura esperam por ele). */
(function () {
  var html = document.documentElement, seen = false
  try { seen = sessionStorage.getItem('splash-seen') === '1' } catch (e) {}
  if (seen) return
  html.classList.add('has-splash')
  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches
  var done = false
  function reveal() {
    if (done) return
    done = true
    try { sessionStorage.setItem('splash-seen', '1') } catch (e) {}
    html.classList.add('is-revealed')
    window.dispatchEvent(new Event('splash:reveal'))
    setTimeout(function () {
      html.classList.remove('has-splash')
      var s = document.querySelector('.splash')
      if (s) s.remove()
    }, reduce ? 300 : 1000)
  }
  window.__splashReveal = reveal
  document.addEventListener('DOMContentLoaded', function () {
    setTimeout(reveal, reduce ? 600 : 2200)
    var s = document.querySelector('.splash')
    if (s) s.addEventListener('click', reveal)
    window.addEventListener('keydown', reveal, { once: true })
  })
  /* segurança: nunca deixa a página presa atrás do splash */
  setTimeout(reveal, 5000)
})()
</script>
